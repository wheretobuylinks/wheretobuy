site:
  name: WhereToBuy
  site: 'https://wheretobuy-8qn.pages.dev'
  base: '/'
  trailingSlash: true

  googleSiteVerificationId: null

metadata:
  title:
    default: WhereToBuy
    template: '%s | WhereToBuy'
  description: 'Discover selected products and find external stores where you can buy them. WhereToBuy is a global product discovery catalog.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: WhereToBuy
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: null
    site: null
    cardType: summary_large_image

i18n:
  language: es
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 6
    post:
      isEnabled: false
      permalink: '/%slug%'
      robots:
        index: true
    list:
      isEnabled: false
      pathname: 'blog'
      robots:
        index: true
    category:
      isEnabled: false
      pathname: 'category'
      robots:
        index: true
    tag:
      isEnabled: false
      pathname: 'tag'
      robots:
        index: false
    isRelatedPostsEnabled: false
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'light:only'
